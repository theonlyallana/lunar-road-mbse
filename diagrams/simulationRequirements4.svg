class E6--><a href="psysml:ae6d7e2f-c73a-4d8a-967f-16e188be40c4" target="_top" title="psysml:ae6d7e2f-c73a-4d8a-967f-16e188be40c4" xlink:actuate="onRequest" xlink:href="psysml:ae6d7e2f-c73a-4d8a-967f-16e188be40c4" xlink:show="new" xlink:title="psysml:ae6d7e2f-c73a-4d8a-967f-16e188be40c4" xlink:type="simple"><g id="elem_E6"><rect fill="#FFFFFF" height="191.3813" id="E6" rx="10" ry="10" style="stroke:#181818;stroke-width:0.5;" width="312" x="34.5" y="7"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91" x="145" y="23.1387">«requirement»</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="269" x="52" y="38.9639">&lt;REQ-R4&gt; planTime: SimRequirement</text><line style="stroke:#181818;stroke-width:0.5;" x1="35.5" x2="345.5" y1="47.2656" y2="47.2656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274" x="40.5" y="74.7795">The planner may use a coarser grid, but</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228" x="40.5" y="91.0764">each plan shall finish within 5 min</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74" x="40.5" y="107.3732">(assumed)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="300" x="40.5" y="123.6701">and the final route shall be rechecked at full</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73" x="40.5" y="139.967">resolution.</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="26" x="177.5" y="59.6123">doc</text><line style="stroke:#181818;stroke-width:1.0;" x1="35.5" x2="345.5" y1="147.2688" y2="147.2688"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="58" x="40.5" y="174.7826">require</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229" x="102.5" y="174.7826">{ sim.planner.maxPlanTime &lt;= 5</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="48" x="40.5" y="191.0795">[min] }</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="75" x="153" y="159.6154">constraints</text></g></a><!--MD5=[9b0c3d40caff5d8658c81137e5a4061f]
@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction

comp usage "~<REQ-C1> delaySampling: SimRequirement  " as E1  <<(T,blue) requirement>> [[psysml:fee5a963-b150-4eb1-afd3-4d61b5f0a974 ]] {
##//doc//##
Round<U+002D>trip delay shall be sampled from 6 to 10 s. Rover state and status messages\nshall update every 60 s (assumed), with message delays handled as timed events.
- -
##//constraints//##
<b>require</b> {\n            sim.commLink.minRoundTrip <U+003D><U+003D> 6 [s] and\n            sim.commLink.maxRoundTrip <U+003D><U+003D> 10 [s]\n        }
}
comp usage "~<REQ-C2> commandHandshake: SimRequirement  " as E2  <<(T,blue) requirement>> [[psysml:c63125b6-f182-424e-ac83-9b5b9ca6c8b4 ]] {
##//doc//##
The rover shall not start a new waypoint without a command, or while Earth is out\nof view. A command with no acknowledgement within 10 s shall be resent, and a dropped\nstatus message is replaced by the next one. Drops and resends shall be logged.
- -
##//constraints//##
<b>require</b> { sim.commLink.ackTimeout <U+003D><U+003D> 10 [s] }
}
comp usage "~<REQ-R1> timeAndEnergy: SimRequirement  " as E3  <<(T,blue) requirement>> [[psysml:370639d9-8955-44ec-9a01-001cb7a8dd2f ]] {
##//doc//##
The planner shall work out time and energy from the active speed, slip and load.
}
comp usage "~<REQ-R2> hardLimits: SimRequirement  " as E4  <<(T,blue) requirement>> [[psysml:a7e2a4b6-d761-4077-9ca5-1612f360927b ]] {
##//doc//##
Hard limits shall be slope, battery reserve, and no driving without Earth in view.
}
comp usage "~<REQ-R3> arrivalObjective: SimRequirement  " as E5  <<(T,blue) requirement>> [[psysml:5ec971e8-56fd-4405-a4d0-2ec6f7e1d9ba ]] {
##//doc//##
The planner shall minimise arrival time, with an energy penalty of 0.001 h per Wh\ndrawn from the battery (assumed and configurable).
}
comp usage "~<REQ-R4> planTime: SimRequirement  " as E6  <<(T,blue) requirement>> [[psysml:ae6d7e2f-c73a-4d8a-967f-16e188be40c4 ]] {
##//doc//##
The planner may use a coarser grid, but each plan shall finish within 5 min (assumed)\nand the final route shall be rechecked at full resolution.
- -
##//constraints//##
<b>require</b> { sim.planner.maxPlanTime <U+003C><U+003D> 5 [min] }
}
@enduml

