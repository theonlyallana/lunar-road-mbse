"75" x="168" y="110.7248">constraints</text></g></a><!--MD5=[a41ee2ca1881eafc9c952a2d8d0e0b8b]
@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction

comp usage "~<REQ-MVP7> siteAndPatchSelection: SimRequirement  " as E1  <<(T,blue) requirement>> [[psysml:633eaf6e-7df7-43bb-8b0c-ec514e2217e7 ]] {
##//doc//##
The demo shall use Connecting Ridge. The 2 km patch and scenario date shall be\nchosen from the data using the spec<U+0027>s selection rules, in order.
}
comp usage "~<REQ-MVP8> r2Framing: SimRequirement  " as E2  <<(T,blue) requirement>> [[psysml:87f430a6-c5fa-4dfe-a794-cfd03caf6159 ]] {
##//doc//##
Scenario R2 shall be described as selected to illustrate the problem, not as a\ntypical trip.
}
comp usage "~<REQ-MVP9> precomputedRunSet: SimRequirement  " as E3  <<(T,blue) requirement>> [[psysml:7dc82c7c-ac38-4407-bb38-5396a44a912d ]] {
##//doc//##
Every control combination shall be precomputed and stored, so the viewer changes\nresults without replanning: 3 no<U+002D>road and 9 road runs per scenario, 24 in total.
- -
##//constraints//##
<b>require</b> { sim.display.storedRuns <U+003D><U+003D> 24 }
}
comp usage "~<REQ-MVP10> displayIndependence: SimRequirement  " as E4  <<(T,blue) requirement>> [[psysml:5a17f823-c240-4e58-9c35-e865a361cd3d ]] {
##//doc//##
The simulation core and stored run set shall stay independent of the final display.
}
comp usage "~<REQ-M1> roadSpeedAndSlip: SimRequirement  " as E5  <<(T,blue) requirement>> [[psysml:f1ab03e6-4654-4498-8721-14e84c4992b1 ]] {
##//doc//##
Speed made good and slip shall use the no<U+002D>road values off<U+002D>road, and the active\npreset on road cells.
}
comp usage "~<REQ-M2> slopeLimit: SimRequirement  " as E6  <<(T,blue) requirement>> [[psysml:1b410c26-0700-489d-8fa0-fe7485bb9bda ]] {
##//doc//##
The planner shall reject cells above the 15 degree slope limit.
- -
##//constraints//##
<b>require</b> { sim.planner.maxPlannedSlope <U+003C><U+003D> 15 [<U+0027>°<U+0027>] }
}
@enduml

