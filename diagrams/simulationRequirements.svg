@startuml
skinparam titleBorderThickness 2
skinparam titleBorderColor red
title EXCEEDS THE LIMIT!!!\nSince it exceeds the maximum number of model elements to be processed,\n the visualization result may be incomplete.
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

comp usage "simulationSpecification: SimRequirement  " as E1  <<(T,blue) requirement>> [[psysml:83891aa5-526f-45f7-aea1-5c234bd41b22 ]] {
##//doc//##
All MVP simulation requirements.
- -
##//constraints//##
<b>require</b> comparison
<b>require</b> reportEitherWay
<b>require</b> caveat
<b>require</b> roadSpeedAndSlip
<b>require</b> slopeLimit
<b>require</b> headingForSun
<b>require</b> loadModel
<b>require</b> chargeBounds
<b>require</b> visibilityFromTerrain
<b>require</b> visibilityHeights
<b>require</b> roadOnlyChangesFlags
<b>require</b> delaySampling
<b>require</b> commandHandshake
<b>require</b> timeAndEnergy
<b>require</b> hardLimits
<b>require</b> arrivalObjective
<b>require</b> planTime
}
@enduml

