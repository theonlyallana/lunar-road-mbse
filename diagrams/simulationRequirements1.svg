<text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="58" x="24.5" y="527.6326">require</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9" x="86.5" y="527.6326">{</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="299" x="24.5" y="543.9295">sim.rover.mobility.maxHeadingOffset &lt;= 50</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36" x="24.5" y="560.2264">['°'] }</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="75" x="144.5" y="512.4654">constraints</text></g></a><!--MD5=[2156ba9850f5573cc1fc38a6a4b2f02b]
class E7--><a href="psysml:27fd10b7-9c05-4aa8-b492-5187abf8c314" target="_top" title="psysml:27fd10b7-9c05-4aa8-b492-5187abf8c314" xlink:actuate="onRequest" xlink:href="psysml:27fd10b7-9c05-4aa8-b492-5187abf8c314" xlink:show="new" xlink:title="psysml:27fd10b7-9c05-4aa8-b492-5187abf8c314" xlink:type="simple"><g id="elem_E7"><rect fill="#FFFFFF" height="91.3781" id="E7" rx="10" ry="10" style="stroke:#181818;stroke-width:0.5;" width="300" x="32" y="233"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91" x="136.5" y="249.1387">«requirement»</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="276" x="40" y="264.9639">&lt;REQ-P1&gt; loadModel: SimRequirement</text><line style="stroke:#181818;stroke-width:0.5;" x1="33" x2="331" y1="273.2656" y2="273.2656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="284" x="38" y="300.7795">Load shall be the awake load, plus driving</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="273" x="38" y="317.0764">power multiplied by the moving fraction.</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="26" x="169" y="285.6123">doc</text></g></a><!--MD5=[b9389687b975829384b498ac4b7476b2]
class E8--><a href="psysml:602c8bc2-c396-4a2d-880b-41605f03ef28" target="_top" title="psysml:602c8bc2-c396-4a2d-880b-41605f03ef28" xlink:actuate="onRequest" xlink:href="psysml:602c8bc2-c396-4a2d-880b-41605f03ef28" xlink:show="new" xlink:title="psysml:602c8bc2-c396-4a2d-880b-41605f03ef28" xlink:type="simple"><g id="elem_E8"><rect fill="#FFFFFF" height="191.3813" id="E8" rx="10" ry="10" style="stroke:#181818;stroke-width:0.5;" width="321" x="21.5" y="7"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91" x="136.5" y="23.1387">«requirement»</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="307" x="24.5" y="38.9639">&lt;REQ-P2&gt; chargeBounds: SimRequirement</text><line style="stroke:#181818;stroke-width:0.5;" x1="22.5" x2="341.5" y1="47.2656" y2="47.2656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286" x="27.5" y="74.7795">Charge shall stay between 0% and 100%,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241" x="27.5" y="91.0764">with excess solar power discarded.</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="26" x="169" y="59.6123">doc</text><line style="stroke:#181818;stroke-width:1.0;" x1="22.5" x2="341.5" y1="98.3781" y2="98.3781"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="58" x="27.5" y="125.892">require</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9" x="89.5" y="125.892">{</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="242" x="75.5" y="142.1889">sim.rover.power.stateOfCharge &gt;=</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="298" x="27.5" y="158.4857">0.0 and sim.rover.power.stateOfCharge &lt;=</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22" x="27.5" y="174.7826">1.0</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9" x="59.5" y="191.0795">}</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="75" x="144.5" y="110.7248">constraints</text></g></a><!--MD5=[0e55ef48014183f9a1de98a4121ddc79]
@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction

comp usage "~<REQ-MVP1> comparison: SimRequirement  " as E1  <<(T,blue) requirement>> [[psysml:156cc258-16d6-4385-855c-a50f0f33bdae ]] {
##//doc//##
The MVP shall compare the same VIPER<U+002D>class rover trip with and without a road,\non real lunar south polar terrain, and report the difference in time, energy,\nrisk and reliability.
}
comp usage "~<REQ-MVP2> reportEitherWay: SimRequirement  " as E2  <<(T,blue) requirement>> [[psysml:71a96a23-3369-40d2-b098-ec7c3ec73e4a ]] {
##//doc//##
Results shall be reported whichever way they turn out, including if the road\nmakes little difference.
}
comp usage "~<REQ-MVP3> caveat: SimRequirement  " as E3  <<(T,blue) requirement>> [[psysml:c49126cf-8b1a-4fcf-adbc-95fd128f5b81 ]] {
##//doc//##
Every shared result shall state that it comes from a simplified model using\nassumed rover loads, slip and road performance.
}
comp usage "~<REQ-M1> roadSpeedAndSlip: SimRequirement  " as E4  <<(T,blue) requirement>> [[psysml:37443c23-cf16-4005-b740-4064a7fee761 ]] {
##//doc//##
Speed made good and slip shall use the no<U+002D>road values off<U+002D>road, and the active\npreset on road cells.
}
comp usage "~<REQ-M2> slopeLimit: SimRequirement  " as E5  <<(T,blue) requirement>> [[psysml:d4b70fa6-bbb6-4f74-97f5-2742f051f3ef ]] {
##//doc//##
The planner shall reject cells above the 15 degree slope limit.
- -
##//constraints//##
<b>require</b> { sim.planner.maxPlannedSlope <U+003C><U+003D> 15 [<U+0027>°<U+0027>] }
}
comp usage "~<REQ-M3> headingForSun: SimRequirement  " as E6  <<(T,blue) requirement>> [[psysml:9177ded7-9a35-4d4d-ab3b-0148c6c5427f ]] {
##//doc//##
Body heading may differ from travel direction by up to 50 degrees while driving.\nIn sunlight the rover shall choose the allowed heading with the most solar input;\nin shadow it shall face its direction of travel.
- -
##//constraints//##
<b>require</b> { sim.rover.mobility.maxHeadingOffset <U+003C><U+003D> 50 [<U+0027>°<U+0027>] }
}
comp usage "~<REQ-P1> loadModel: SimRequirement  " as E7  <<(T,blue) requirement>> [[psysml:27fd10b7-9c05-4aa8-b492-5187abf8c314 ]] {
##//doc//##
Load shall be the awake load, plus driving power multiplied by the moving fraction.
}
comp usage "~<REQ-P2> chargeBounds: SimRequirement  " as E8  <<(T,blue) requirement>> [[psysml:602c8bc2-c396-4a2d-880b-41605f03ef28 ]] {
##//doc//##
Charge shall stay between 0% and 100%, with excess solar power discarded.
- -
##//constraints//##
<b>require</b> {\n            sim.rover.power.stateOfCharge ><U+003D> 0.0 and sim.rover.power.stateOfCharge <U+003C><U+003D> 1.0\n        }
}
@enduml

