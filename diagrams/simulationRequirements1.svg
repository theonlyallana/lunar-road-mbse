@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction

comp usage "~<REQ-MVP1> comparison: SimRequirement  " as E1  <<(T,blue) requirement>> [[psysml:32d07b2a-c212-42b9-8948-319754579d63 ]] {
##//doc//##
The MVP shall compare the same VIPER<U+002D>class rover trip with and without a road,\non real lunar south polar terrain, and report the difference in time, energy,\nrisk and reliability.
}
comp usage "~<REQ-MVP2> reportEitherWay: SimRequirement  " as E2  <<(T,blue) requirement>> [[psysml:b2330d26-9cac-4fc7-918d-986f952edd59 ]] {
##//doc//##
Results shall be reported whichever way they turn out, including if the road\nmakes little difference.
}
comp usage "~<REQ-MVP3> caveat: SimRequirement  " as E3  <<(T,blue) requirement>> [[psysml:896116e1-a228-4809-acb0-425dae437b80 ]] {
##//doc//##
Every shared result shall state that it comes from a simplified model using\nassumed rover loads, slip and road performance. VIPER is driven by a human team,\nwhile this demo plans automatically.
}
comp usage "~<REQ-MVP4> assumedValuesConfigurable: SimRequirement  " as E4  <<(T,blue) requirement>> [[psysml:435b2943-cf68-488e-bd54-19330f285b51 ]] {
##//doc//##
Every assumed value shall be configurable.
}
comp usage "~<REQ-MVP5> fixedScenario: SimRequirement  " as E5  <<(T,blue) requirement>> [[psysml:805957c5-5d6d-4e60-8fa9-2f81acf24238 ]] {
##//doc//##
Each comparison shall use one fixed start, goal, start time and terrain map.
}
comp usage "~<REQ-MVP6> widerTerrainForShadows: SimRequirement  " as E6  <<(T,blue) requirement>> [[psysml:7fbc18f2-9036-4c48-a980-b612b194bfc9 ]] {
##//doc//##
The shadow calculation shall use a wider, lower<U+002D>resolution terrain map around\nthe 2 km patch, because distant ridges cast shadows into the area.
}
@enduml

