="294" x="40.5" y="285.1857">sim.environment.earthVisibilityHeight == 2</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53" x="40.5" y="301.4826">[m] and</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247" x="88.5" y="317.7795">sim.environment.sunlightHeight ==</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36" x="40.5" y="334.0764">1 [m]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9" x="72.5" y="350.3732">}</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="75" x="158.5" y="237.4248">constraints</text></g></a><!--MD5=[60a26617385b1d2d0262a64233df1f8d]
class E6--><a href="psysml:c3c9f4ee-7bc5-4f9d-b8b6-f452e036de68" target="_top" title="psysml:c3c9f4ee-7bc5-4f9d-b8b6-f452e036de68" xlink:actuate="onRequest" xlink:href="psysml:c3c9f4ee-7bc5-4f9d-b8b6-f452e036de68" xlink:show="new" xlink:title="psysml:c3c9f4ee-7bc5-4f9d-b8b6-f452e036de68" xlink:type="simple"><g id="elem_E6"><rect fill="#FFFFFF" height="91.3781" id="E6" rx="10" ry="10" style="stroke:#181818;stroke-width:0.5;" width="378" x="7" y="7"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91" x="150.5" y="23.1387">«requirement»</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="364" x="10" y="38.9639">&lt;REQ-E3&gt; roadOnlyChangesFlags: SimRequirement</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="384" y1="47.2656" y2="47.2656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286" x="13" y="74.7795">Turning the road off shall change only the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71" x="13" y="91.0764">road flags.</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="26" x="183" y="59.6123">doc</text></g></a><!--MD5=[0690bd96fe253d48de55e1821a21e4bd]
@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction

comp usage "~<REQ-M3> headingForSun: SimRequirement  " as E1  <<(T,blue) requirement>> [[psysml:c540f46d-27d1-4ad8-8ed7-2677bb5769ea ]] {
##//doc//##
Body heading may differ from travel direction by up to plus or minus 50 degrees\n(assumed) while driving.\nIn sunlight the rover shall choose the allowed heading with the most solar input;\nin shadow it shall face its direction of travel.
- -
##//constraints//##
<b>require</b> { sim.rover.mobility.maxHeadingOffset <U+003C><U+003D> 50 [<U+0027>°<U+0027>] }
}
comp usage "~<REQ-P1> loadModel: SimRequirement  " as E2  <<(T,blue) requirement>> [[psysml:be34bba8-4d3f-4090-a275-5fe6eb36a9aa ]] {
##//doc//##
Load shall be the awake load, plus driving power multiplied by the moving fraction.
}
comp usage "~<REQ-P2> chargeBounds: SimRequirement  " as E3  <<(T,blue) requirement>> [[psysml:462a718f-6986-4023-8f2f-fe372bb1bca3 ]] {
##//doc//##
Charge shall stay between 0% and 100%, with excess solar power discarded.
- -
##//constraints//##
<b>require</b> {\n            sim.rover.power.stateOfCharge ><U+003D> 0.0 and sim.rover.power.stateOfCharge <U+003C><U+003D> 1.0\n        }
}
comp usage "~<REQ-E1> visibilityFromTerrain: SimRequirement  " as E4  <<(T,blue) requirement>> [[psysml:1f0af55d-8a65-4754-9794-5fa1ff1dc40d ]] {
##//doc//##
Sun and Earth visibility shall be calculated from terrain, not hand<U+002D>painted.
}
comp usage "~<REQ-E2> visibilityHeights: SimRequirement  " as E5  <<(T,blue) requirement>> [[psysml:ddca1534-c01c-45a0-a1e4-53942c60c9c0 ]] {
##//doc//##
Earth visibility shall use 2 m height and sunlight 1 m height (both assumed).
- -
##//constraints//##
<b>require</b> {\n            sim.environment.earthVisibilityHeight <U+003D><U+003D> 2 [m] and\n            sim.environment.sunlightHeight <U+003D><U+003D> 1 [m]\n        }
}
comp usage "~<REQ-E3> roadOnlyChangesFlags: SimRequirement  " as E6  <<(T,blue) requirement>> [[psysml:c3c9f4ee-7bc5-4f9d-b8b6-f452e036de68 ]] {
##//doc//##
Turning the road off shall change only the road flags.
}
@enduml

