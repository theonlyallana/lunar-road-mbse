@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction
skinparam linetype ortho
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec usage "demoContext" as E1 [[psysml:3515c13d-aeb3-4ea7-9118-a10a028ad6a7 ]] {
rec usage "terrain: LunarTerrain" as E2 [[psysml:2fec4988-75fa-4f08-924b-f79fb0502e4f ]] {
portout "^terrainOut: TerrainPort  " as E3  <<(T,blue) port>> [[psysml:db915ff7-6a8c-40d5-b44c-f7dc38a1d5fc ]] 
}
rec usage "ephemeris: SunAndEarthEphemeris" as E4 [[psysml:1da027a1-f1b7-473a-808a-e6205861f0ad ]] {
portout "^ephemerisOut: EphemerisPort  " as E5  <<(T,blue) port>> [[psysml:603356e3-7bcb-4f91-998f-b3f359c8a625 ]] 
}
rec usage "viewer: DemoViewer" as E6 [[psysml:ab220b36-c3fa-4ecd-9e02-7e95123f5da1 ]] {
}
rec usage "sim: LunarRoadDemoSystem" as E7 [[psysml:7be76fb3-b041-4da2-b24e-c3e845b10a79 ]] {
portin "^ephemerisIn: ~EphemerisPort  " as E8  <<(T,blue) port>> [[psysml:fd76bedf-b38c-4424-96bc-adb7a3bc9b9f ]] 
portin "^terrainIn: ~TerrainPort  " as E9  <<(T,blue) port>> [[psysml:3f6d59e9-24dd-4674-958b-a363c3de185f ]] 
}
}
E3 -[thickness=3]- E9 [[psysml:e3c906a9-285b-4674-96df-b549e2b8533f ]] 
E5 -[thickness=3]- E8 [[psysml:5e9be97c-0131-4d20-a0b7-4edd7604295e ]] 
@enduml

