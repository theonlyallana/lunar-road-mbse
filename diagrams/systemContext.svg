@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec usage "demoContext" as E1 [[psysml:0d884011-382a-489f-b31b-e842331b5578 ]] {
rec usage "terrain: LunarTerrain" as E2 [[psysml:fd80fde3-1a89-4f33-ba06-c39f0223898e ]] {
portout "^terrainOut: TerrainPort  " as E3  <<(T,blue) port>> [[psysml:129de1c4-c280-4ef1-8b24-ed2f325eee59 ]] 
}
rec usage "ephemeris: SunAndEarthEphemeris" as E4 [[psysml:1fdbc1c8-c6ea-4ddb-9fc8-6c25de83a8e6 ]] {
portout "^ephemerisOut: EphemerisPort  " as E5  <<(T,blue) port>> [[psysml:857f8c3a-ecad-4c17-9b92-8074d5a4b446 ]] 
}
rec usage "viewer: DemoViewer" as E6 [[psysml:9f3a65a6-6468-4ad0-b03d-9cf81843ba9a ]] {
}
rec usage "sim: LunarRoadDemoSystem" as E7 [[psysml:7e008b0e-0b4b-4610-bd93-8adbcf8c69b8 ]] {
portin "^terrainIn: ~TerrainPort  " as E8  <<(T,blue) port>> [[psysml:46316b96-6c73-4022-b37f-72c3a6c1acee ]] 
portin "^ephemerisIn: ~EphemerisPort  " as E9  <<(T,blue) port>> [[psysml:8ece7a32-98f8-4892-9c2d-d475dadcb729 ]] 
}
}
