@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction
skinparam linetype ortho
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec usage "demoContext" as E1 [[psysml:eb5cf5ff-77c3-4f55-9d59-f9d26779a42b ]] {
rec usage "terrain: LunarTerrain" as E2 [[psysml:eed3e258-ff32-403b-859a-10b48c4aa5c2 ]] {
portout "^terrainOut: TerrainPort  " as E3  <<(T,blue) port>> [[psysml:65b68757-a5b5-4550-a2e3-b1d57fd39918 ]] 
}
rec usage "ephemeris: SunAndEarthEphemeris" as E4 [[psysml:99eb9a64-e1d2-4b2e-bbf1-5a2c111b2cfb ]] {
portout "^ephemerisOut: EphemerisPort  " as E5  <<(T,blue) port>> [[psysml:dacf8bf8-a330-4443-a807-7f28d3b536d7 ]] 
}
rec usage "viewer: DemoViewer" as E6 [[psysml:8b9ed048-87fd-4d6a-aa66-18b54171b828 ]] {
}
rec usage "sim: LunarRoadDemoSystem" as E7 [[psysml:fa737ae2-e942-4ff7-970a-339dc283e0b6 ]] {
portin "^terrainIn: ~TerrainPort  " as E8  <<(T,blue) port>> [[psysml:c3a08e8c-2b9d-4f37-94e2-7007f04daaac ]] 
portin "^ephemerisIn: ~EphemerisPort  " as E9  <<(T,blue) port>> [[psysml:a03c34f0-a078-441e-9474-ce69a89d94ca ]] 
}
}
