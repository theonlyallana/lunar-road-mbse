@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction
skinparam linetype ortho
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec usage "demoContext" as E1 [[psysml:4e50d26f-10fa-46a2-a606-2dcc8d761c85 ]] {
rec usage "terrain: LunarTerrain" as E2 [[psysml:3fb41041-d0e8-472d-8b20-af4499a3cbb9 ]] {
portout "^terrainOut: TerrainPort  " as E3  <<(T,blue) port>> [[psysml:fb78533e-e210-4392-a2b8-ac0ac7d79ed8 ]] 
}
rec usage "ephemeris: SunAndEarthEphemeris" as E4 [[psysml:b1b5df72-b2c7-426f-a869-2be66a197223 ]] {
portout "^ephemerisOut: EphemerisPort  " as E5  <<(T,blue) port>> [[psysml:cedf8642-2052-4c90-b51c-96a06b20a3b0 ]] 
}
rec usage "viewer: DemoViewer" as E6 [[psysml:162c05a9-8332-4f23-8a58-6f4e2c3ff875 ]] {
}
rec usage "sim: LunarRoadDemoSystem" as E7 [[psysml:e4296ace-3723-4a1c-821e-f0d8c7da0bd3 ]] {
portin "^ephemerisIn: ~EphemerisPort  " as E8  <<(T,blue) port>> [[psysml:a1f678ca-f88c-4177-944e-824a4bca9f6d ]] 
portin "^terrainIn: ~TerrainPort  " as E9  <<(T,blue) port>> [[psysml:1ad44856-a3b6-445c-bcfd-3fc21723f60e ]] 
}
}
